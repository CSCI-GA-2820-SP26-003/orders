apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: behave
spec:
  params:
    - name: BASE_URL
      description: The external route URL of the deployed Orders service
      type: string
  workspaces:
    - name: source
  steps:
    - name: run-bdd-tests
      image: python:3.12-slim
      workingDir: $(workspaces.source.path)
      env:
        - name: BASE_URL
          value: $(params.BASE_URL)
      script: |
        #!/bin/bash
        set -e
        apt-get update && apt-get install -y --no-install-recommends \
          wget gnupg ca-certificates curl \
          chromium chromium-driver
        pip install --quiet pipenv
        pipenv install --dev --system

        echo "=== Verifying BASE_URL is reachable ==="
        echo "BASE_URL: ${BASE_URL}"
        curl -sL --max-time 10 "${BASE_URL}" | head -30 || echo "WARNING: curl to BASE_URL failed"

        echo "=== Running Behave BDD tests ==="
        behave

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: pytest
spec:
  workspaces:
    - name: source
  sidecars:
    - name: postgres
      image: postgres:15-alpine
      env:
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          value: postgres
        - name: POSTGRES_DB
          value: testdb
      readinessProbe:
        exec:
          command: ["pg_isready", "-U", "postgres"]
        initialDelaySeconds: 5
        periodSeconds: 5
  steps:
    - name: run-tests
      image: python:3.12-slim
      workingDir: $(workspaces.source.path)
      env:
        - name: DATABASE_URI
          value: "postgresql+psycopg://postgres:postgres@localhost:5432/testdb"
      script: |
        #!/bin/bash
        pip install --quiet pipenv
        pipenv install --dev --system
        flask db-create
        export RETRY_COUNT=1
        python -m pytest --pspec --cov=service --cov-fail-under=95 --disable-warnings --tb=short

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: pylint
spec:
  workspaces:
    - name: source
  steps:
    - name: run-lint
      image: python:3.12-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/bash
        set -e
        pip install --quiet pipenv
        pipenv install --dev --system
        flake8 service tests --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 service tests --count --max-complexity=10 --max-line-length=127 --statistics
        pylint service tests --max-line-length=127

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: build-and-push-image
spec:
  workspaces:
    - name: source
  params:
    - name: IMAGE
      description: Image name to build and push
      type: string
    - name: CONTEXT
      description: Build context
      type: string
      default: .
  steps:
    - name: build-and-push
      image: quay.io/openshift/origin-cli:latest
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/bash
        set -e

        NAMESPACE=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)

        echo "Building and pushing Orders image..."
        echo "Namespace: ${NAMESPACE}"
        echo "Expected image: $(params.IMAGE)"

        echo "Ensuring OpenShift binary BuildConfig exists..."
        if ! oc get bc orders -n "${NAMESPACE}" >/dev/null 2>&1; then
          oc new-build --binary --name=orders --strategy=docker -n "${NAMESPACE}"
        else
          echo "BuildConfig orders already exists."
        fi

        echo "Starting binary Docker build from context: $(params.CONTEXT)"
        oc start-build orders \
          --from-dir="$(params.CONTEXT)" \
          --follow \
          --wait \
          -n "${NAMESPACE}"

        echo "Verifying pushed image stream tag..."
        oc get istag orders:latest -n "${NAMESPACE}"

        echo "Image build and push completed successfully."

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: deploy-orders
spec:
  workspaces:
    - name: source
  params:
    - name: IMAGE
      description: Image name to deploy
      type: string
  steps:
    - name: deploy
      image: quay.io/openshift/origin-cli:latest
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/bash
        set -e

        echo "Deploying Orders service to OpenShift..."

        NAMESPACE=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)
        IMAGE="$(params.IMAGE)"

        echo "Using namespace: ${NAMESPACE}"
        echo "Using image: ${IMAGE}"

        echo "Applying Orders Kubernetes/OpenShift manifests..."
        oc apply -f k8s/deployment.yaml -n "${NAMESPACE}"
        oc apply -f k8s/service.yaml -n "${NAMESPACE}"
        oc apply -f k8s/route.yaml -n "${NAMESPACE}"

        echo "Setting Orders image built by Tekton..."
        oc set image deployment/orders orders="${IMAGE}" -n "${NAMESPACE}"

        echo "Waiting for Orders deployment rollout to complete..."
        oc rollout status deployment/orders -n "${NAMESPACE}" --timeout=300s

        echo "Waiting for Orders pod to become Ready..."
        oc wait --for=condition=Ready pod -l app=orders -n "${NAMESPACE}" --timeout=300s

        echo "Checking OpenShift route..."
        ROUTE_HOST=$(oc get route orders -n "${NAMESPACE}" -o jsonpath='{.spec.host}')

        if [ -z "$ROUTE_HOST" ]; then
          echo "ERROR: Route host is empty."
          exit 1
        fi

        HEALTH_URL="http://${ROUTE_HOST}/health"
        echo "Checking health endpoint: ${HEALTH_URL}"

        curl -fsS "${HEALTH_URL}"

        echo ""
        echo "Orders service deployed successfully."
        echo "Health check passed."