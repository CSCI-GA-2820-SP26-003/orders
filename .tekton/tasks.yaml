apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: pytest
spec:
  workspaces:
    - name: source
  sidecars:
    - name: postgres
      image: postgres:15-alpine
      env:
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          value: postgres
        - name: POSTGRES_DB
          value: testdb
      readinessProbe:
        exec:
          command: ["pg_isready", "-U", "postgres"]
        initialDelaySeconds: 5
        periodSeconds: 5
  steps:
    - name: run-tests
      image: python:3.12-slim
      workingDir: $(workspaces.source.path)
      env:
        - name: DATABASE_URI
          value: "postgresql+psycopg://postgres:postgres@localhost:5432/testdb"
      script: |
        #!/bin/bash
        pip install --quiet pipenv
        pipenv install --dev --system
        flask db-create
        export RETRY_COUNT=1
        python -m pytest --pspec --cov=service --cov-fail-under=95 --disable-warnings --tb=short

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: pylint
spec:
  workspaces:
    - name: source
  steps:
    - name: run-lint
      image: python:3.12-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/bash
        set -e
        pip install --quiet pipenv
        pipenv install --dev --system
        flake8 service tests --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 service tests --count --max-complexity=10 --max-line-length=127 --statistics
        pylint service tests --max-line-length=127

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: buildah-nopriv
spec:
  workspaces:
    - name: source
  params:
    - name: IMAGE
      description: Image name to build and push
      type: string
    - name: DOCKERFILE
      description: Path to Dockerfile
      type: string
      default: ./Dockerfile
    - name: CONTEXT
      description: Build context
      type: string
      default: .
  steps:
    - name: build-and-push
      image: quay.io/buildah/stable:v1.37.0
      workingDir: $(workspaces.source.path)
      env:
        - name: STORAGE_DRIVER
          value: vfs
        - name: BUILDAH_ISOLATION
          value: chroot
      script: |
        #!/bin/sh
        set -e

        echo "Building image: $(params.IMAGE)"
        buildah bud --storage-driver=vfs --isolation=chroot \
          -f $(params.DOCKERFILE) \
          -t $(params.IMAGE) \
          $(params.CONTEXT)

        echo "Pushing image: $(params.IMAGE)"
        buildah push --storage-driver=vfs --tls-verify=false $(params.IMAGE)

        echo "Image build and push completed successfully."